<h1>Практична робота №9: фільтрація масиву пайпом</h1>

<!-- Поле для пошуку -->
<input
  type="text"
  [(ngModel)]="searchTerm"
  placeholder="Пошук за назвою..."
/>

<ul>
  <li *ngFor="let item of items | filterByField:'name':searchTerm">
    {{ item.id }} — {{ item.name }} ({{ item.category }})
  </li>
</ul>

<hr>

<!-- Поле для додавання нового елемента -->
<input
  type="text"
  [(ngModel)]="newItemName"
  placeholder="Назва нового елемента..."
/>
<button (click)="addItem()">Додати елемент</button>
