<div class="profile-card">
  <div class="card-header">
    <div class="avatar">
      {{ user.name | slice:0:1 }}
    </div>
    <div class="user-info">
      <h2>{{ user.name }}</h2>
      <span class="user-id">ID: #{{ user.id }}</span>
    </div>
    <div
      class="status-badge"
      [ngClass]="{
           'active': user.status === eUserStatus.Active,
           'inactive': user.status === eUserStatus.Inactive,
           'pending': user.status === eUserStatus.Pending
         }"
    >
      {{ user.status }}
    </div>
  </div>

  <div class="card-body">
    <div class="section">
      <h3>📍 Адреса</h3>
      <p class="address-text">
        м. {{ user.address.city }}, {{ user.address.street }}
      </p>
    </div>

    <div class="section">
      <div class="hobbies-header">
        <h3>🎯 Хобі</h3>
        <span class="hobbies-count-badge">{{ getHobbiesCount() }}</span>
      </div>

      <ul class="hobbies-list">
        <li *ngFor="let hobby of user.hobbies" class="hobby-item">
          {{ hobby }}
        </li>
      </ul>
    </div>
  </div>
</div>
